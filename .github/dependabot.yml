version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      typescript-eslint:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "angular-eslint"
          - "@eslint/*"
          - "eslint*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@analogjs/*"
          - "cypress"
          - "axe-core"
      tailwind:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
