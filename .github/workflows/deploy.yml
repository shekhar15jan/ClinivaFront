# Deploy Cliniva front (front end). develop -> staging (https://cliniva.codeatcloudai.com, Hostinger), a release/* branch -> production
# (https://cliniva.codeatcloud.com, Hostinger) after approval. main is merged from the release branch only after production is healthy. Per-environment secrets and variables; NAMES only in
# platform/docs/plans/github-actions-aws-secrets.md. No value lives in this file.
# Build with --base-href=/, upload a tgz, extract to a stage folder, MOVE the live files to a backup folder and MOVE the new ones
# in (nothing is deleted; a failed check moves the old files back). The staging front calls the staging API (the OptiPlex through
# Tailscale Funnel) and the production front calls the production API (AWS): the address comes from the variable API_URL.
name: Deploy Cliniva front

on:
  push:
    branches: [develop, 'release/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-Cliniva front-${{ inputs.environment || (startsWith(github.ref_name, 'release/') && 'production' || 'staging') }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.environment || (startsWith(github.ref_name, 'release/') && 'production' || 'staging') }}

jobs:
  deploy:
    name: Build and deploy to ${{ inputs.environment || (startsWith(github.ref_name, 'release/') && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # production: this environment must have required reviewers.
    environment:
      name: ${{ inputs.environment || (startsWith(github.ref_name, 'release/') && 'production' || 'staging') }}
      url: ${{ vars.SITE_URL }}
    env:
      API_URL: ${{ vars.API_URL }}
      SITE_DIR: ${{ vars.HOSTINGER_SITE_DIR }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:ci --if-present

      - name: Build
        run: npm run build:prod -- --base-href=/

      - name: Put the API address in (the address in environment.prod.ts is replaced in the built files)
        run: |
          set -euo pipefail
          [ -n "$API_URL" ] || { echo "::error::the variable API_URL is not set for this environment"; exit 1; }
          DIST=$(find dist -name index.html -path '*browser*' -printf '%h\n' | head -1)
          [ -n "$DIST" ] || { echo "::error::build folder not found"; exit 1; }
          OLD=$(grep -ohE "apiUrl: *'[^']+'" src/environments/environment.prod.ts | head -1 | sed -E "s/apiUrl: *'([^']+)'/\1/")
          if [ -n "$OLD" ] && [ "$OLD" != "$API_URL" ]; then
            grep -rlF "$OLD" "$DIST" | xargs -r sed -i "s|$OLD|$API_URL|g"
          fi
          if grep -rq "__API_URL__" "$DIST"; then echo "::error::the API placeholder is still in the build"; exit 1; fi
          grep -q '<base href="/">' "$DIST/index.html" || { echo "::error::index.html base href is not /"; exit 1; }
          tar -czf front.tgz -C "$DIST" .

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          USER_NAME: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host hostinger"
            echo "  HostName $HOST"
            echo "  Port $PORT"
            echo "  User $USER_NAME"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Upload and swap (nothing is deleted)
        run: |
          set -euo pipefail
          TS=$(date +%Y%m%d-%H%M%S); echo "TS=$TS" >> "$GITHUB_ENV"
          ssh hostinger "mkdir -p ~/deploy-tmp ~/deploy-backups"
          scp front.tgz hostinger:deploy-tmp/cliniva-$TARGET-$TS.tgz
          ssh hostinger "TS=$TS TARGET=$TARGET SITE_DIR='$SITE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          # SITE_DIR keeps its own folders (for example api/ and .htaccess): they are not in the build and are never touched.
          STAGE=~/deploy-tmp/cliniva-stage-$TARGET-$TS
          BACKUP=~/deploy-backups/cliniva-$TARGET-$TS
          mkdir -p "$STAGE" "$BACKUP"
          tar -xzf ~/deploy-tmp/cliniva-$TARGET-$TS.tgz -C "$STAGE"
          grep -q '<base href="/">' "$STAGE/index.html"
          cd "$STAGE"
          for item in *; do
            if [ -e "$SITE_DIR/$item" ]; then mv "$SITE_DIR/$item" "$BACKUP/$item"; fi
            mv "$STAGE/$item" "$SITE_DIR/$item"
          done
          echo "Swapped. Backup of the old files: $BACKUP"
          REMOTE

      - name: Check the live site
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "${{ vars.SITE_URL }}" || echo 000)
            if [ "$code" = 200 ] && grep -q '<base href="/">' /tmp/index.html; then echo "Site OK"; exit 0; fi
            sleep 6
          done
          echo "::error::the live site did not answer correctly"; exit 1

      - name: Roll back on failure (move the backup files back)
        if: failure()
        run: |
          [ -n "${TS:-}" ] || { echo "Nothing was swapped"; exit 0; }
          ssh hostinger "TS=$TS TARGET=$TARGET SITE_DIR='$SITE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          BACKUP=~/deploy-backups/cliniva-$TARGET-$TS
          [ -d "$BACKUP" ] || exit 0
          cd "$BACKUP"
          for item in *; do
            rm -rf "$SITE_DIR/$item"
            mv "$BACKUP/$item" "$SITE_DIR/$item"
          done
          echo "Rolled back from $BACKUP"
          REMOTE
