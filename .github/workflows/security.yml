# SEC-7 and SEC-9: secrets and known-vulnerability scanning in every repository, and a monthly re-scan.
# Reports only for now (exit-code 0): it is tightened to fail on HIGH and CRITICAL once the first findings are cleared.
name: security

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets in the code and history (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Known vulnerabilities in dependencies and configuration (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
