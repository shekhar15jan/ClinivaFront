name: Frontend Production

# main -> hms.codeatcloud.com on Hostinger shared hosting (docs/finalized-deployment-strategy.md).
# Staging (develop) is build-staging.yml. The legacy mock E2E suite is no longer a gate: the live suite
# (e2e-live) and the staging smoke test run against real backends.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Security audit
        run: |
          # Code we ship to browsers (dependencies): any high-severity advisory blocks the build.
          # Build tools (devDependencies, never shipped): reported as a warning instead of blocking every deploy.
          # Today that is braces/micromatch/postcss-selector-parser via Tailwind 3 (removed by the Tailwind 4 migration);
          # they only ever see our own file patterns, never user input.
          # If npm's own audit service is down the audit cannot be evaluated: warn loudly and rely on the next run.
          set +e
          out=$(npm audit --omit=dev --audit-level=high 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && echo "$out" | grep -qE "audit endpoint returned an error|503 Service Unavailable"; then
            echo "::warning::npm audit service unavailable - the audit gate was NOT evaluated on this run"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if ! npm audit --audit-level=high > /tmp/audit-all.txt 2>&1; then
            echo "::warning::Build tools (not shipped) have high-severity advisories - see the full report below"
            cat /tmp/audit-all.txt
          fi
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium (vitest browser mode)
        run: npx playwright install --with-deps chromium
      - name: Run tests with coverage
        run: npx vitest run --coverage
      - name: Check coverage threshold
        run: |
          STATEMENTS=$(jq '.total.statements.pct' coverage/coverage-summary.json)
          echo "Statement coverage: ${STATEMENTS}%"
          if (( $(echo "$STATEMENTS < 70" | bc -l) )); then
            echo "::error::Statement coverage ${STATEMENTS}% is below 70% threshold"
            exit 1
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: security

  deploy:
    name: Deploy to production (Hostinger)
    needs: [static-analysis, unit-tests, codeql]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check production configuration
        env:
          HOST: ${{ vars.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          TARGET: ${{ vars.HOSTINGER_TARGET_DIR }}
        run: |
          missing=()
          for name in HOST USER KEY TARGET; do [ -z "${!name}" ] && missing+=("$name"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Set HOSTINGER_HOST, HOSTINGER_TARGET_DIR (vars) and HOSTINGER_SSH_USER, HOSTINGER_SSH_KEY (secrets). Missing: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Point the build at the production API
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          if [ -n "$PROD_API_URL" ]; then
            sed -i "s|apiUrl: '.*'|apiUrl: '${PROD_API_URL}'|" src/environments/environment.prod.ts
            # The page's Content-Security-Policy must allow calls and images from that API host too.
            ORIGIN=$(echo "$PROD_API_URL" | sed -E 's|^(https?://[^/]+).*|\1|')
            sed -i "s|https://api.codeatcloud.com|${ORIGIN}|g" src/index.html
          fi
          grep -n "apiUrl" src/environments/environment.prod.ts

      - name: Production build
        run: npm run build:prod

      - name: Add Apache rewrite rules
        run: |
          OUT=$(dirname "$(find dist -name index.html -path '*browser*' | head -1)")
          cp deploy/hostinger.htaccess "$OUT/.htaccess"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT" | head -20

      - name: Upload to Hostinger (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOSTINGER_HOST }}
          port: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: ${{ env.OUT }}/*
          target: ${{ vars.HOSTINGER_TARGET_DIR }}
          strip_components: 3
          overwrite: true

      - name: Smoke test
        env:
          APP_URL: ${{ vars.PROD_APP_URL || 'https://hms.codeatcloud.com' }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL/")
            deep=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL/any-clinic/login")
            echo "Attempt $i: / -> $code, deep link -> $deep"
            if [ "$code" = "200" ] && [ "$deep" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::The production app did not answer 200 at $APP_URL (and for a deep link)"
          exit 1
