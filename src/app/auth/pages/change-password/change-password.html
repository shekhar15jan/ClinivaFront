<div class="space-y-lg">
  <header>
    <h2 class="text-headline-md font-bold text-on-surface mb-xs">Set a New Password</h2>
    <p class="text-body-md text-secondary">
      Use the temporary password you were sent to choose a password of your own, then sign in.
    </p>
  </header>

  @if (errorMessage) {
    <div id="change-password-error" class="bg-error-container text-error px-md py-sm rounded-lg mb-4 text-body-sm" role="alert">
      {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="submit()" class="space-y-md" novalidate>
    <div>
      <label for="cp-email" class="text-label-sm text-secondary block mb-xs">Email address</label>
      <input id="cp-email" name="email" type="email" [(ngModel)]="email" autocomplete="username"
        class="w-full px-md py-3 rounded-lg border border-outline-variant bg-transparent text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
    </div>
    <div>
      <label for="cp-current" class="text-label-sm text-secondary block mb-xs">Current or temporary password</label>
      <input id="cp-current" name="currentPassword" type="password" [(ngModel)]="currentPassword" autocomplete="current-password"
        class="w-full px-md py-3 rounded-lg border border-outline-variant bg-transparent text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
    </div>
    <div>
      <label for="cp-new" class="text-label-sm text-secondary block mb-xs">New password (at least {{ minLength }} characters)</label>
      <input id="cp-new" name="newPassword" type="password" [(ngModel)]="newPassword" autocomplete="new-password"
        class="w-full px-md py-3 rounded-lg border border-outline-variant bg-transparent text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
    </div>
    <div>
      <label for="cp-confirm" class="text-label-sm text-secondary block mb-xs">Confirm new password</label>
      <input id="cp-confirm" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" autocomplete="new-password"
        class="w-full px-md py-3 rounded-lg border border-outline-variant bg-transparent text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
    </div>

    <button type="submit" [disabled]="isLoading"
      class="w-full bg-primary-container text-primary-on-container font-label-md py-4 px-lg rounded-lg shadow-sm hover:shadow-md hover:bg-primary hover:text-white transition-all flex items-center justify-center gap-sm disabled:opacity-50 disabled:cursor-not-allowed">
      @if (isLoading) {
        <span class="material-symbols-outlined animate-spin">progress_activity</span>
      }
      <span>{{ isLoading ? 'Saving...' : 'Change Password' }}</span>
    </button>
  </form>

  <div class="text-center">
    <button type="button" (click)="backToLogin()" class="text-body-sm text-primary font-semibold hover:underline">
      Back to sign in
    </button>
  </div>
</div>
