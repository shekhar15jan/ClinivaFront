<div class="space-y-6">
  @if (errorMessage) {
    <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded-md">
      <p class="text-sm text-red-700">{{ errorMessage }}</p>
    </div>
  }

  <form #loginForm="ngForm" (ngSubmit)="sendOtp()" class="space-y-6">
    <div class="relative">
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        #emailCtrl="ngModel"
        required
        email
        class="peer w-full border border-outline-variant rounded-lg px-4 py-4 pt-6 text-on-surface focus:outline-none focus:ring-2 focus:ring-medical-blue/20 focus:border-medical-blue transition-all placeholder-transparent bg-transparent"
        placeholder="name@clinic.com"
      />
      <label
        for="email"
        class="absolute left-4 top-1 text-xs text-outline transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-1 peer-focus:text-xs peer-focus:text-medical-blue bg-white px-1"
      >
        Email Address
      </label>
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading"
      class="w-full bg-medical-blue hover:bg-medical-blue-dark text-white font-medium py-3.5 px-4 rounded-lg transition-all shadow-sm hover:shadow-md flex items-center justify-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @if (isLoading) {
        <span class="material-symbols-outlined animate-spin">progress_activity</span>
      }
      <span>{{ isLoading ? 'Sending OTP...' : 'Send OTP' }}</span>
      <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform"
        >arrow_forward</span
      >
    </button>
  </form>
</div>
