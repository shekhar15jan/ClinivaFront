<div class="h-full px-4 sm:px-6 flex items-center justify-between bg-surface/80 backdrop-blur-md border-b border-outline-variant">
  <!-- Left: Hamburger + Search -->
  <div class="flex items-center gap-3 flex-1">
    <button
      (click)="menuClick.emit()"
      class="md:hidden p-2 text-on-surface-variant hover:bg-surface-container-high rounded-lg transition-colors min-h-touch min-w-touch flex items-center justify-center"
      aria-label="Open menu"
    >
      <span class="material-symbols-outlined text-[24px]">menu</span>
    </button>

    <div class="relative flex-1 max-w-lg hidden sm:block">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">search</span>
      </div>
      <input type="text" class="block w-full pl-10 pr-3 py-2 bg-surface-container-low border border-outline-variant rounded-lg text-sm text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="Search patients, phone numbers...">
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-2 sm:gap-4 ml-2 sm:ml-4">
    <!-- Mobile search icon -->
    <button class="sm:hidden p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
      <span class="material-symbols-outlined text-[24px]">search</span>
    </button>

    <button class="hidden sm:flex items-center gap-2 px-4 py-2 bg-primary hover:bg-primary-dark text-white text-sm font-medium rounded-lg shadow-sm transition-all hover:shadow-md active:scale-95">
      <span class="material-symbols-outlined text-[20px]">add</span>
      + New Appointment
    </button>

    <!-- Notification Bell with Dropdown -->
    <div class="relative notification-wrapper">
      <button
        (click)="toggleDropdown()"
        class="relative p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors"
        aria-label="Notifications"
      >
        @if (unreadCount > 0) {
          <span class="absolute top-0.5 right-0.5 flex h-4 w-4 items-center justify-center rounded-full bg-error text-[10px] font-bold text-white ring-2 ring-surface">
            {{ unreadCount > 9 ? '9+' : unreadCount }}
          </span>
        }
        <span class="material-symbols-outlined text-[24px]">notifications</span>
      </button>

      <!-- Notification Dropdown -->
      @if (showDropdown) {
        <div class="notification-dropdown absolute right-0 top-full mt-2 w-80 sm:w-96 bg-surface border border-outline-variant rounded-xl shadow-xl z-50 overflow-hidden">
          <!-- Header -->
          <div class="flex items-center justify-between px-4 py-3 border-b border-outline-variant bg-surface-container-low">
            <h3 class="text-sm font-semibold text-on-surface">Notifications</h3>
            @if (unreadCount > 0) {
              <button (click)="markAllAsRead()" class="text-xs text-primary hover:text-primary-dark font-medium">
                Mark all read
              </button>
            }
          </div>

          <!-- Notification List -->
          <div class="max-h-96 overflow-y-auto">
            @if (notifications.length === 0) {
              <div class="px-4 py-8 text-center">
                <span class="material-symbols-outlined text-4xl text-outline">notifications_off</span>
                <p class="mt-2 text-sm text-on-surface-variant">No notifications yet</p>
              </div>
            } @else {
              @for (notification of notifications; track notification.id) {
                <button
                  (click)="markAsRead(notification)"
                  class="w-full flex items-start gap-3 px-4 py-3 text-left hover:bg-surface-container-high transition-colors border-b border-outline-variant/50 last:border-b-0"
                  [class.bg-surface-container-low]="!notification.isRead"
                >
                  <span class="material-symbols-outlined text-[20px] mt-0.5"
                    [class.text-primary]="!notification.isRead"
                    [class.text-outline]="notification.isRead">
                    {{ getNotificationIcon(notification.type) }}
                  </span>
                  <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-on-surface truncate" [class.font-semibold]="!notification.isRead">
                      {{ notification.title }}
                    </p>
                    @if (notification.message) {
                      <p class="text-xs text-on-surface-variant mt-0.5 line-clamp-2">{{ notification.message }}</p>
                    }
                    <p class="text-xs text-outline mt-1">{{ getTimeAgo(notification.createdAt) }}</p>
                  </div>
                  @if (!notification.isRead) {
                    <span class="h-2 w-2 rounded-full bg-primary flex-shrink-0 mt-2"></span>
                  }
                </button>
              }
            }
          </div>

          <!-- Footer -->
          @if (notifications.length > 0) {
            <div class="px-4 py-2 border-t border-outline-variant bg-surface-container-low">
              <button (click)="closeDropdown()" class="w-full text-center text-xs text-primary hover:text-primary-dark font-medium py-1">
                Close
              </button>
            </div>
          }
        </div>
      }
    </div>

    <button class="hidden sm:block p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
      <span class="material-symbols-outlined text-[24px]">help</span>
    </button>
  </div>
</div>
