<div class="h-full px-6 flex items-center justify-between bg-surface border-b border-outline-variant">
  <!-- Search -->
  <div class="flex-1 max-w-lg">
    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <span class="material-symbols-outlined text-outline group-focus-within:text-medical-blue transition-colors">search</span>
      </div>
      <input type="text" class="block w-full pl-10 pr-3 py-2 bg-surface-container-low border border-outline-variant rounded-lg text-sm text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-medical-blue/20 focus:border-medical-blue transition-all" placeholder="Search patients, phone numbers...">
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-4 ml-4">
    <button class="hidden sm:flex items-center gap-2 px-4 py-2 bg-medical-blue hover:bg-medical-blue-dark text-white text-sm font-medium rounded-lg shadow-sm transition-all hover:shadow-md active:scale-95">
      <span class="material-symbols-outlined text-[20px]">add</span>
      + New Appointment
    </button>

    <button class="relative p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
      <span class="absolute top-1.5 right-1.5 block h-2 w-2 rounded-full bg-status-red ring-2 ring-surface"></span>
      <span class="material-symbols-outlined text-[24px]">notifications</span>
    </button>

    <button class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
      <span class="material-symbols-outlined text-[24px]">help</span>
    </button>
  </div>
</div>
