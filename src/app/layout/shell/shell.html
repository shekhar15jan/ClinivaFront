<div class="flex h-screen bg-surface overflow-hidden">
  <!-- Desktop Sidebar -->
  <app-sidebar class="w-64 flex-shrink-0 border-r border-outline-variant bg-surface hidden md:flex md:flex-col"></app-sidebar>

  <!-- Mobile Drawer -->
  <app-mobile-drawer [isOpen]="drawerOpen()" (closed)="closeDrawer()"></app-mobile-drawer>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <app-header class="h-16 flex-shrink-0 border-b border-outline-variant bg-surface" (menuClick)="openDrawer()"></app-header>

    <!-- Trial days left / read-only notice with Renew -->
    <app-subscription-banner></app-subscription-banner>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-4 sm:p-6 pb-20 md:pb-6">
      @if (showLocked()) {
        <app-subscription-locked></app-subscription-locked>
      } @else {
        <router-outlet></router-outlet>
      }
    </main>
  </div>

  <!-- FAB (Floating Action Button) -->
  <app-fab></app-fab>

  <!-- First-run tour (once per person; restart from Help) -->
  <app-tour></app-tour>

  <!-- Mobile Bottom Navigation -->
  <app-bottom-nav></app-bottom-nav>
</div>
